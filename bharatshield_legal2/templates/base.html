<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>{% block title %}{{ app_name }}{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css"/>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="layout">
    <nav class="navbar">
      <a class="navbar-brand" href="/">Bharat<span>Shield</span> Legal</a>
      <ul class="nav-links">
        <li><a href="/" {% if active_nav == 'home' %}class="active"{% endif %}>Home</a></li>
        <li><a href="/submit" {% if active_nav == 'submit' %}class="active"{% endif %}>New case</a></li>
        <li><a href="/admin" class="nav-admin">Admin portal</a></li>
      </ul>
    </nav>
    {% block content %}{% endblock %}
  </div>
  <script src="/static/js/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
